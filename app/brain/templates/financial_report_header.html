<div style="width:100%; font-family: Arial, Helvetica, sans-serif; color:#334155; padding:0 34px 8px 34px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #ede9fe; -webkit-print-color-adjust: exact;">
  <img src="data:image/png;base64,{{ logo_base64 }}" style="height:76px; width:auto;">
  <div style="text-align:right;">
    <div style="font-weight:800; color:#0f172a; font-size:15px;">Informe Financiero</div>
    <div style="color:#64748b; font-size:9.5px; margin-top:3px;">Generado el {{ fecha_generacion }}</div>
    <div style="margin-top:4px;">
      <span style="font-weight:700; color:#7c3aed; font-size:11px;">{{ cliente.razon_social }} — RUC {{ cliente.ruc }}</span>
      <span style="background:#7c3aed; color:#ffffff; font-weight:700; font-size:9px; padding:2px 8px; border-radius:999px; margin-left:6px;">{{ periodo_label }}</span>
    </div>
  </div>
</div>
